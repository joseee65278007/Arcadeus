<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  html,body{margin:0;height:100%;background:#0c0e14;color:#eef0f6;font-family:system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #status{font-size:1rem;color:#8b90a8;min-height:1.4em}
  #board{display:grid;grid-template-columns:repeat(3,90px);grid-template-rows:repeat(3,90px);gap:8px}
  .cell{background:#171a26;border:1px solid #262b3d;border-radius:10px;font-size:2.4rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .cell:hover{border-color:#7c5cff}
  .cell.x{color:#00e0b8}
  .cell.o{color:#ff5c7a}
  button{background:#7c5cff;border:none;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.9rem}
  #modeRow{display:flex;gap:8px}
  .modeBtn{background:#171a26;border:1px solid #262b3d;color:#8b90a8;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:0.85rem}
  .modeBtn.active{background:#7c5cff;color:#fff;border-color:#7c5cff}
</style>
</head>
<body>
  <div id="modeRow">
    <button class="modeBtn active" data-mode="cpu">Vs Computer</button>
    <button class="modeBtn" data-mode="2p">2 Players</button>
  </div>
  <div id="status">Your turn — X</div>
  <div id="board"></div>
  <button id="restart">Restart</button>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
let board, current, gameOver, mode = 'cpu';

const WINS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function init() {
  board = Array(9).fill(null);
  current = 'X';
  gameOver = false;
  render();
  updateStatus();
}

function render() {
  boardEl.innerHTML = '';
  board.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
    cell.textContent = v || '';
    cell.addEventListener('click', () => handleMove(i));
    boardEl.appendChild(cell);
  });
}

function updateStatus(text) {
  if (text) { statusEl.textContent = text; return; }
  statusEl.textContent = `${current}'s turn`;
}

function checkWinner(b) {
  for (const [a, c, d] of WINS) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
  }
  if (b.every(x => x)) return 'draw';
  return null;
}

function handleMove(i) {
  if (gameOver || board[i]) return;
  board[i] = current;
  render();

  const winner = checkWinner(board);
  if (winner) return endGame(winner);

  current = current === 'X' ? 'O' : 'X';
  updateStatus();

  if (mode === 'cpu' && current === 'O' && !gameOver) {
    setTimeout(cpuMove, 350);
  }
}

function cpuMove() {
  // Try to win, then block, then take center/corner, else random.
  const empty = board.map((v, i) => v ? null : i).filter(i => i !== null);

  const tryFind = (mark) => {
    for (const i of empty) {
      const copy = [...board];
      copy[i] = mark;
      if (checkWinner(copy) === mark) return i;
    }
    return null;
  };

  let move = tryFind('O') ?? tryFind('X');
  if (move === null) {
    if (board[4] === null) move = 4;
    else {
      const corners = [0,2,6,8].filter(i => board[i] === null);
      move = corners.length ? corners[Math.floor(Math.random()*corners.length)] : empty[Math.floor(Math.random()*empty.length)];
    }
  }
  handleMove(move);
}

function endGame(winner) {
  gameOver = true;
  updateStatus(winner === 'draw' ? "It's a draw!" : `${winner} wins!`);
}

document.getElementById('restart').addEventListener('click', init);
document.querySelectorAll('.modeBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.modeBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    init();
  });
});

init();
</script>
</body>
</html>
