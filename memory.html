<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  html,body{margin:0;min-height:100%;background:#0c0e14;color:#eef0f6;font-family:system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
  #hud{display:flex;gap:20px;font-size:0.95rem;color:#8b90a8}
  #hud b{color:#00e0b8}
  #grid{display:grid;grid-template-columns:repeat(4,70px);gap:8px}
  .card{width:70px;height:70px;background:#171a26;border:1px solid #262b3d;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;
    transition:transform .15s;user-select:none}
  .card.flipped,.card.matched{background:#1e2233;border-color:#7c5cff}
  .card.matched{opacity:0.5;cursor:default}
  .card.hidden-face{color:transparent}
  button{background:#7c5cff;border:none;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.9rem}
</style>
</head>
<body>
  <div id="hud">Moves: <b id="moves">0</b> &nbsp; Matches: <b id="matches">0</b>/8</div>
  <div id="grid"></div>
  <button id="restart">Restart</button>

<script>
const ICONS = ['🍕','🚀','🐙','🎧','🌵','🎲','🪁','🍩'];
const grid = document.getElementById('grid');
const movesEl = document.getElementById('moves');
const matchesEl = document.getElementById('matches');

let cards, flipped, matched, moves, locked;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init() {
  cards = shuffle([...ICONS, ...ICONS]);
  flipped = [];
  matched = new Set();
  moves = 0;
  locked = false;
  movesEl.textContent = 0;
  matchesEl.textContent = 0;
  render();
}

function render() {
  grid.innerHTML = '';
  cards.forEach((icon, i) => {
    const el = document.createElement('div');
    const isOpen = flipped.includes(i) || matched.has(i);
    el.className = 'card' + (matched.has(i) ? ' matched' : flipped.includes(i) ? ' flipped' : '');
    el.textContent = isOpen ? icon : '?';
    el.addEventListener('click', () => handleFlip(i));
    grid.appendChild(el);
  });
}

function handleFlip(i) {
  if (locked || flipped.includes(i) || matched.has(i)) return;
  flipped.push(i);
  render();

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    locked = true;
    const [a, b] = flipped;
    if (cards[a] === cards[b]) {
      matched.add(a); matched.add(b);
      matchesEl.textContent = matched.size / 2;
      flipped = [];
      locked = false;
      render();
    } else {
      setTimeout(() => {
        flipped = [];
        locked = false;
        render();
      }, 700);
    }
  }
}

document.getElementById('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
